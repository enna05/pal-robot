<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P.A.L. Controller</title>
<style>
  :root { --bg:#0b0f14; --card:#121821; --card2:#18202b; --line:#222d3b; --text:#e5e7eb; --muted:#8b97a8; --accent:#4f9dff; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,sans-serif; }
  header { display:flex; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:20px; letter-spacing:.08em; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:20px; max-width:1200px; margin:0 auto; }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  button { font:inherit; color:var(--text); background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:#334155; } button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#05101f; font-weight:600; }
  button.active { background:var(--accent); border-color:var(--accent); color:#05101f; font-weight:600; }
  input[type=text] { flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; font:inherit; }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .camwrap { position:relative; background:#05080c; border-radius:10px; overflow:hidden; aspect-ratio:4/3; }
  .camwrap video, .camwrap canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .camwrap .ph { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:13px; padding:12px; text-align:center; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); display:inline-block; margin-right:6px; }
  .dot.on { background:var(--ok); }
  label.chk { display:inline-flex; gap:6px; align-items:center; color:var(--muted); font-size:13px; cursor:pointer; }
  #chatLog { height: 120px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 12px; font-family: monospace; display: none; }
  .msg { margin-bottom: 4px; }
  .msg.user { color: var(--accent); }
  .msg.ai { color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>P.A.L. Controller</h1>
  <div class="row" style="margin:0">
    <span class="dot" id="dot"></span>
    <span id="connText">Disconnected</span>
  </div>
</header>

<main>
  <div class="card">
    <h2>Robot View</h2>
    <canvas id="robot" width="560" height="340" style="width:100%; border-radius:10px;"></canvas>
    
    <h2 style="margin-top:20px;">Expression</h2>
    <div class="row" id="exprs"></div>

    <h2 style="margin-top:20px;">Voice / AI Commands</h2>
    <div class="row">
      <input type="text" id="say" placeholder="e.g. look left, be happy, what is this?" spellcheck="false">
      <button class="primary" id="sayBtn">Send</button>
      <button id="micBtn" title="Click and speak (Chrome/Edge)">🎤</button>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="speak" checked> Speak replies</label>
    </div>
    <div id="chatLog"></div>
    <div id="reply" style="color:var(--muted); font-size:13px; margin-top:8px;"></div>
  </div>

  <div class="card">
    <h2>Camera & Vision</h2>
    <div class="camwrap">
      <video id="cam" playsinline muted></video>
      <canvas id="camBoxes"></canvas>
      <div class="ph" id="camPh">Camera is off</div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button id="camBtn">Start Camera</button>
      <button class="primary" id="idBtn">Identify Object</button>
    </div>
    <div id="visStatus" style="font-size:13px; color:var(--muted); margin-top:6px;">Model loads on first use.</div>
    
    <h2 style="margin-top:20px;">ESP32 Connection</h2>
    <div class="row">
      <input type="text" id="espIp" placeholder="e.g. 192.168.1.45" spellcheck="false">
      <button class="primary" id="connectBtn">Connect</button>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const EXPRS = ['neutral', 'happy', 'curious', 'sleepy', 'surprised', 'sad', 'angry'];
  const state = { expr:'neutral', connected:false };
  let ws = null, nextId = 1, reconnectTimer = null;
  let palVoice = null;

  // --- Voice Selection (Cute) ---
  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    palVoice = voices.find(v => v.name.includes('Google UK English Female')) || 
               voices.find(v => v.name.includes('Samantha')) || 
               voices.find(v => v.name.includes('Google US English')) || 
               voices.find(v => v.lang === 'en-US' && v.name.includes('Female')) ||
               voices[0];
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }

  // --- WebSocket Connection ---
  $('espIp').value = localStorage.getItem('espIp') || '';
  
  function connect() {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    clearTimeout(reconnectTimer);
    
    const ip = $('espIp').value.trim();
    if (!ip) return alert('Please enter the ESP32 IP address');
    localStorage.setItem('espIp', ip);
    
    $('connText').textContent = 'Connecting...';
    ws = new WebSocket(`ws://${ip}:81`);
    
    ws.onopen = () => {
      $('dot').className = 'dot on';
      $('connText').textContent = 'Connected';
      state.connected = true;
      drawRobot();
    };
    
    ws.onclose = () => {
      $('dot').className = 'dot';
      $('connText').textContent = 'Disconnected - Retrying...';
      state.connected = false;
      drawRobot();
      reconnectTimer = setTimeout(connect, 3000); 
    };
    
    ws.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        if (m.type === 'state') {
          if (m.expr) state.expr = m.expr;
          sync();
        }
      } catch(err) {}
    };
  }

  $('connectBtn').onclick = connect;

  function send(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return false;
    ws.send(JSON.stringify({ ...obj, id: nextId++ }));
    return true;
  }

  // --- UI Controls ---
  EXPRS.forEach(e => {
    const b = document.createElement('button');
    b.textContent = e; b.dataset.expr = e; 
    b.onclick = () => {
      state.expr = e;
      sync();
      send({ type:'cmd', expr:e });
    };
    $('exprs').appendChild(b);
  });

  function sync() {
    document.querySelectorAll('[data-expr]').forEach(b => b.classList.toggle('active', b.dataset.expr === state.expr));
    drawRobot();
  }

  // --- Voice Recognition ---
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR(); 
    rec.lang = 'en-US'; 
    rec.interimResults = false;
    let listening = false;
    
    rec.onstart = () => { listening = true; $('micBtn').classList.add('active'); $('reply').textContent = 'Listening...'; };
    rec.onend = () => { listening = false; $('micBtn').classList.remove('active'); };
    rec.onresult = e => { 
      const txt = e.results[0][0].transcript; 
      $('say').value = txt; 
      handleSay(txt); 
    };
    
    $('micBtn').onclick = () => { if (listening) rec.stop(); else rec.start(); };
  }

  // --- AI Brain ---
  const chatLog = $('chatLog');
  function addMsg(role, text) {
    chatLog.style.display = 'block';
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = (role === 'user' ? 'You: ' : 'P.A.L.: ') + text;
    chatLog.appendChild(d);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function speakAndIdle(reply) {
    if ($('speak').checked && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(reply); 
      u.voice = palVoice;
      u.rate = 1.0;
      u.pitch = 1.4;
      speechSynthesis.speak(u);
    }
  }

  async function handleSay(text) {
    if (!text) return;
    
    const t = text.toLowerCase().replace(/\b(paul|pall|pale)\b/g, 'pal');
    
    // --- 1. FAST LOCAL COMMANDS ---
    let localCmd = null;
    if (t.includes('happy') || t.includes('smile') || t.includes('joy') || t.includes('excited')) localCmd = 'happy';
    else if (t.includes('sad') || t.includes('cry') || t.includes('tears')) localCmd = 'sad';
    else if (t.includes('angry') || t.includes('mad') || t.includes('furious') || t.includes('rage')) localCmd = 'angry';
    else if (t.includes('sleep') || t.includes('tired') || t.includes('goodnight')) localCmd = 'sleepy';
    else if (t.includes('surpris') || t.includes('wow')) localCmd = 'surprised';
    else if (t.includes('curious') || t.includes('wonder') || t.includes('confused')) localCmd = 'curious';
    else if (t.includes('neutral') || t.includes('normal')) localCmd = 'neutral';

    if (localCmd) {
      state.expr = localCmd;
      sync();
      send({ type:'cmd', expr:localCmd });
      $('reply').textContent = `Face changed to ${localCmd}`;
    }

    if (t.includes('what is this') || t.includes('identify') || t.includes('look')) { 
      identify(); 
      return; 
    }

    if (localCmd && t.split(' ').length < 4) {
      addMsg('ai', `Okay, I am ${localCmd}.`);
      speakAndIdle(`Okay, I am ${localCmd}.`);
      return; 
    }

    // --- 2. AI PROCESSING (Pollinations.ai - No Key Needed) ---
    $('reply').textContent = 'Thinking...';
    addMsg('user', text);
    $('say').value = '';

    const systemPrompt = `
      You are P.A.L. (Personal Assistant Liaison), a smart, helpful desk robot.
      You are highly intelligent, slightly witty, and you speak confidently and clearly.
      Keep your verbal answers short, punchy, and conversational (1-2 sentences max).
      
      You must reply ONLY with a valid JSON object in this format:
      {
        "reply": "Your verbal response goes here.",
        "expr": "one_of_the_faces_above"
      }
      Available faces: neutral, happy, curious, sleepy, surprised, sad, angry.
      
      Rules for faces:
      - If the user says something funny, set "expr" to "happy".
      - If the user asks a question, set "expr" to "curious".
      - If the user is mean to you, set "expr" to "sad" or "angry".
      - If the user says "goodnight", set "expr" to "sleepy".
      - Default to "neutral" for normal conversation.
    `;

    try {
      // Pollinations AI requires no API key!
      const encodedPrompt = encodeURIComponent(systemPrompt + "\n\nUser: " + text);
      const response = await fetch(`https://text.pollinations.ai/${encodedPrompt}?json=true`);
      const data = await response.json();
      
      // Pollinations returns the parsed JSON directly
      addMsg('ai', data.reply);
      $('reply').textContent = `Reply: ${data.reply}`;
      speakAndIdle(data.reply);

      if (data.expr && EXPRS.includes(data.expr)) {
        state.expr = data.expr;
        sync();
        send({ type: 'cmd', expr: data.expr });
      }

    } catch (e) {
      addMsg('ai', "Connection error.");
      $('reply').textContent = "Error connecting to AI.";
    }
  }
  
  $('sayBtn').onclick = () => handleSay($('say').value.trim());
  $('say').addEventListener('keydown', e => { if (e.key === 'Enter') $('sayBtn').click(); });

  // --- Vision ---
  let stream = null, modelPromise = null;
  const loadScript = src => new Promise((ok, fail) => {
    const el = document.createElement('script'); el.src = src; el.onload = ok;
    el.onerror = fail; document.head.appendChild(el);
  });

  async function loadModel() {
    if (!modelPromise) modelPromise = (async () => {
      $('visStatus').textContent = 'Loading object model...';
      await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
      const m = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
      $('visStatus').textContent = 'Model ready';
      return m;
    })();
    return modelPromise;
  }

  async function startCam() {
    if (stream) return;
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    $('cam').srcObject = stream; 
    await $('cam').play();
    $('camPh').style.display = 'none';
    $('camBtn').textContent = 'Stop Camera';
  }

  $('camBtn').onclick = async () => {
    if (stream) {
      stream.getTracks().forEach(t => t.stop()); stream = null;
      $('cam').srcObject = null; $('camPh').style.display = ''; $('camBtn').textContent = 'Start Camera';
    } else {
      try { await startCam(); } catch(e) { $('visStatus').textContent = 'Camera error: ' + e.message; }
    }
  };

  async function identify() {
    try {
      await startCam();
      const model = await loadModel();
      const v = $('cam');
      if (v.readyState < 2) await new Promise(r => v.addEventListener('loadeddata', r, { once:true }));
      
      const preds = (await model.detect(v, 10)).sort((a, b) => b.score - a.score);
      const objs = preds.filter(p => p.score >= 0.5).map(p => ({ class:p.class, score:+p.score.toFixed(2) }));
      
      if (objs.length > 0) {
        $('visStatus').textContent = `I see: ${objs.map(o => o.class).join(', ')}`;
        const o = objs[0];
        const reply = `That looks like a ${o.class}.`;
        $('reply').textContent = reply;
        addMsg('ai', reply);
        state.expr = 'curious'; sync();
        send({ type:'cmd', expr:'curious' });
        speakAndIdle(reply);
      } else {
        $('visStatus').textContent = 'I cannot see anything clearly.';
        state.expr = 'sad'; sync();
        send({ type:'cmd', expr:'sad' });
        speakAndIdle("I can't tell what that is.");
      }
    } catch(e) {
      $('visStatus').textContent = 'Error: ' + e.message;
    }
  }

  $('idBtn').onclick = identify;

  // --- Drawing ---
  const rc = $('robot').getContext('2d');
  function drawRobot() {
    const c = rc, W = 560, H = 340;
    c.clearRect(0, 0, W, H);
    
    c.fillStyle = '#0d1218';
    c.beginPath(); c.roundRect(80, 50, 400, 240, 40); c.fill();
    c.strokeStyle = '#2a3441'; c.lineWidth = 3; c.stroke();
    
    const eyeColor = state.connected ? '#8ee8ff' : '#4b5563';
    c.fillStyle = eyeColor;
    
    if (state.expr === 'happy') {
      c.beginPath(); c.arc(200, 140, 30, Math.PI, 0); c.strokeStyle = eyeColor; c.lineWidth = 8; c.stroke();
      c.beginPath(); c.arc(360, 140, 30, Math.PI, 0); c.stroke();
      c.beginPath(); c.arc(280, 190, 40, 0, Math.PI); c.stroke();
    } else if (state.expr === 'sad') {
      c.fillRect(170, 130, 60, 10);
      c.fillRect(330, 130, 60, 10);
      c.beginPath(); c.arc(280, 210, 40, Math.PI, 0); c.strokeStyle = eyeColor; c.lineWidth = 8; c.stroke();
      c.beginPath(); c.arc(170, 145, 5, 0, Math.PI*2); c.fill(); 
    } else if (state.expr === 'angry') {
      c.beginPath(); c.moveTo(170, 110); c.lineTo(230, 130); c.strokeStyle = eyeColor; c.lineWidth = 8; c.stroke();
      c.beginPath(); c.moveTo(390, 110); c.lineTo(330, 130); c.stroke();
      c.beginPath(); c.arc(280, 210, 40, Math.PI, 0); c.stroke();
    } else if (state.expr === 'sleepy') {
      c.fillRect(170, 140, 60, 8);
      c.fillRect(330, 140, 60, 8);
      c.beginPath(); c.arc(280, 190, 15, 0, Math.PI*2); c.fill();
    } else if (state.expr === 'surprised') {
      c.beginPath(); c.arc(200, 140, 35, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(360, 140, 35, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(280, 200, 20, 0, Math.PI*2); c.strokeStyle = eyeColor; c.lineWidth = 6; c.stroke();
    } else if (state.expr === 'curious') {
      c.beginPath(); c.arc(200, 140, 20, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(360, 140, 40, 0, Math.PI*2); c.fill();
      c.beginPath(); c.moveTo(260, 200); c.lineTo(300, 190); c.strokeStyle = eyeColor; c.lineWidth = 6; c.stroke();
    } else {
      c.beginPath(); c.arc(200, 140, 30, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(360, 140, 30, 0, Math.PI*2); c.fill();
      c.fillRect(250, 190, 60, 8);
    }
  }
  
  sync();
})();
</script>
</body>
</html>
