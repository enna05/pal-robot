<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P.A.L. Controller</title>
<style>
  :root { --bg:#0b0f14; --card:#121821; --card2:#18202b; --line:#222d3b; --text:#e5e7eb; --muted:#8b97a8; --accent:#4f9dff; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,sans-serif; }
  header { display:flex; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:20px; letter-spacing:.08em; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:20px; max-width:1200px; margin:0 auto; }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  button { font:inherit; color:var(--text); background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:#334155; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#05101f; font-weight:600; }
  input[type=text], input[type=password] { flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; font:inherit; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); display:inline-block; margin-right:6px; }
  .dot.on { background:var(--ok); }
  #chatLog { height: 200px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 10px; }
  .msg { margin-bottom: 8px; }
  .msg.user { color: var(--accent); }
  .msg.ai { color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>P.A.L. Controller</h1>
  <div class="row" style="margin:0">
    <span class="dot" id="dot"></span>
    <span id="connText">Disconnected</span>
  </div>
</header>

<main>
  <div class="card">
    <h2>Robot View</h2>
    <canvas id="robot" width="560" height="340" style="width:100%; border-radius:10px;"></canvas>
    
    <h2 style="margin-top:20px;">Expression</h2>
    <div class="row" id="exprs"></div>

    <h2 style="margin-top:20px;">ESP32 Connection</h2>
    <div class="row">
      <input type="text" id="espIp" placeholder="ESP32 IP (e.g. 192.168.1.45)" spellcheck="false">
      <button class="primary" id="connectBtn">Connect</button>
    </div>
  </div>

  <div class="card">
    <h2>P.A.L. AI Chat</h2>
    <div style="margin-bottom: 10px;">
      <input type="password" id="apiKey" placeholder="Paste your Groq API Key here (gsk_...)" style="width: 100%;">
    </div>
    <div id="chatLog">
      <div class="msg ai">P.A.L.: System online. Personal Assistant Liaison ready. What do you need?</div>
    </div>
    <div class="row">
      <input type="text" id="say" placeholder="Talk to P.A.L..." spellcheck="false">
      <button class="primary" id="sayBtn">Send</button>
      <button id="micBtn">🎤</button>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const EXPRS = ['neutral', 'happy', 'curious', 'sleepy', 'surprised', 'sad', 'angry'];
  const state = { expr:'neutral', connected:false };
  let ws = null, nextId = 1;
  let palVoice = null;

  // --- Voice Selection ---
  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    // Try to find a clear, slightly robotic male voice
    palVoice = voices.find(v => v.name.includes('Google US English')) || 
               voices.find(v => v.name.includes('David')) || 
               voices.find(v => v.name.includes('Microsoft Mark')) ||
               voices[0];
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }

  // --- WebSocket Connection ---
  $('espIp').value = localStorage.getItem('espIp') || '';
  $('apiKey').value = localStorage.getItem('apiKey') || '';
  
  function connect() {
    if (ws) { ws.close(); ws = null; }
    const ip = $('espIp').value.trim();
    if (!ip) return alert('Please enter the ESP32 IP address');
    localStorage.setItem('espIp', ip);
    
    $('connText').textContent = 'Connecting...';
    ws = new WebSocket(`ws://${ip}:81`);
    
    ws.onopen = () => {
      $('dot').className = 'dot on';
      $('connText').textContent = 'Connected';
      state.connected = true;
      drawRobot();
    };
    
    ws.onclose = () => {
      $('dot').className = 'dot';
      $('connText').textContent = 'Disconnected';
      state.connected = false;
      drawRobot();
    };
    
    ws.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        if (m.type === 'state' && m.expr) {
          state.expr = m.expr;
          sync();
        }
      } catch(err) {}
    };
  }

  $('connectBtn').onclick = connect;

  function sendToRobot(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return false;
    ws.send(JSON.stringify({ ...obj, id: nextId++ }));
    return true;
  }

  // --- UI Controls ---
  EXPRS.forEach(e => {
    const b = document.createElement('button');
    b.textContent = e; b.dataset.expr = e; 
    b.onclick = () => { state.expr = e; sync(); sendToRobot({ type:'cmd', expr:e }); };
    $('exprs').appendChild(b);
  });

  function sync() {
    document.querySelectorAll('[data-expr]').forEach(b => b.classList.toggle('active', b.dataset.expr === state.expr));
    drawRobot();
  }

  // --- Voice Recognition ---
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false;
    let listening = false;
    rec.onstart = () => { listening = true; $('micBtn').style.background = 'var(--accent)'; };
    rec.onend = () => { listening = false; $('micBtn').style.background = ''; };
    rec.onresult = e => { const txt = e.results[0][0].transcript; $('say').value = txt; chatWithPAL(txt); };
    $('micBtn').onclick = () => { if (listening) rec.stop(); else rec.start(); };
  }

  // --- AI Brain (P.A.L. Persona) ---
  const chatLog = $('chatLog');
  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = (role === 'user' ? 'You: ' : 'P.A.L.: ') + text;
    chatLog.appendChild(d);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = palVoice;
      u.rate = 0.95; // Normal-ish speed, slightly deliberate
      u.pitch = 1.0; // Standard pitch
      speechSynthesis.speak(u);
    }
  }

  async function chatWithPAL(text) {
    const key = $('apiKey').value.trim();
    if (!key) return alert("Please enter your Groq API Key first!");

    addMsg('user', text);
    $('say').value = '';

    const systemPrompt = `
      You are P.A.L. (Personal Assistant Liaison), a desk robot.
      You are helpful, slightly witty, and highly intelligent.
      You are not Baymax. Do not use healthcare companion phrases unless asked about health.
      You have a physical face on a screen (on the ESP32) and you can control it.
      Keep your verbal answers short, punchy, and conversational (1-2 sentences max).
      
      You must reply ONLY with a valid JSON object in this format:
      {
        "reply": "Your verbal response goes here.",
        "expr": "one_of_the_faces_above"
      }
      Available faces: neutral, happy, curious, sleepy, surprised, sad, angry.
      
      Rules for faces:
      - If the user says something funny, set "expr" to "happy".
      - If the user asks a question, set "expr" to "curious".
      - If the user is mean to you, set "expr" to "sad" or "angry".
      - If the user says "goodnight", set "expr" to "sleepy".
      - Default to "neutral" for normal conversation.
    `;

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: "llama3-8b-8192",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: text }
          ],
          response_format: { type: "json_object" }
        })
      });

      const data = await response.json();
      
      if (data.error) {
        addMsg('ai', "Error: " + data.error.message);
        return;
      }

      const aiResponse = JSON.parse(data.choices[0].message.content);
      
      addMsg('ai', aiResponse.reply);
      speak(aiResponse.reply);

      if (aiResponse.expr && EXPRS.includes(aiResponse.expr)) {
        state.expr = aiResponse.expr;
        sync();
        sendToRobot({ type: 'cmd', expr: aiResponse.expr });
      }

    } catch (e) {
      addMsg('ai', "Connection error: " + e.message);
    }
  }

  $('sayBtn').onclick = () => {
    const text = $('say').value.trim();
    if (text) chatWithPAL(text);
  };
  $('say').addEventListener('keydown', e => { if (e.key === 'Enter') $('sayBtn').click(); });

  // --- Drawing ---
  const rc = $('robot').getContext('2d');
  function drawRobot() {
    const c = rc, W = 560, H = 340;
    c.clearRect(0, 0, W, H);
    c.fillStyle = '#0d1218';
    c.beginPath(); c.roundRect(80, 50, 400, 240, 40); c.fill();
    c.strokeStyle = '#2a3441'; c.lineWidth = 3; c.stroke();
    const eyeColor = state.connected ? '#8ee8ff' : '#4b5563';
    c.fillStyle = eyeColor;
    
    if (state.expr === 'happy') {
      c.beginPath(); c.arc(200, 140, 30, Math.PI, 0); c.lineWidth = 8; c.strokeStyle = eyeColor; c.stroke();
      c.beginPath(); c.arc(360, 140, 30, Math.PI, 0); c.stroke();
      c.beginPath(); c.arc(280, 190, 40, 0, Math.PI); c.stroke();
    } else if (state.expr === 'sad') {
      c.fillRect(170, 130, 60, 10); c.fillRect(330, 130, 60, 10);
      c.beginPath(); c.arc(280, 210, 40, Math.PI, 0); c.lineWidth = 8; c.strokeStyle = eyeColor; c.stroke();
      c.beginPath(); c.arc(170, 145, 5, 0, Math.PI*2); c.fill(); 
    } else if (state.expr === 'angry') {
      c.beginPath(); c.moveTo(170, 110); c.lineTo(230, 130); c.lineWidth = 8; c.strokeStyle = eyeColor; c.stroke();
      c.beginPath(); c.moveTo(390, 110); c.lineTo(330, 130); c.stroke();
      c.beginPath(); c.arc(280, 210, 40, Math.PI, 0); c.stroke();
    } else if (state.expr === 'sleepy') {
      c.fillRect(170, 140, 60, 8); c.fillRect(330, 140, 60, 8);
      c.beginPath(); c.arc(280, 190, 15, 0, Math.PI*2); c.fill();
    } else if (state.expr === 'surprised') {
      c.beginPath(); c.arc(200, 140, 35, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(360, 140, 35, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(280, 200, 20, 0, Math.PI*2); c.lineWidth = 6; c.strokeStyle = eyeColor; c.stroke();
    } else if (state.expr === 'curious') {
      c.beginPath(); c.arc(200, 140, 20, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(360, 140, 40, 0, Math.PI*2); c.fill();
      c.beginPath(); c.moveTo(260, 200); c.lineTo(300, 190); c.lineWidth = 6; c.strokeStyle = eyeColor; c.stroke();
    } else {
      c.beginPath(); c.arc(200, 140, 30, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(360, 140, 30, 0, Math.PI*2); c.fill();
      c.fillRect(250, 190, 60, 8);
    }
  }
  
  sync();
})();
</script>
</body>
</html>
